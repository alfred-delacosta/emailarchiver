<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EmailArchiver email to PDF">
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  <!-- envelope body -->
  <rect x="12" y="20" width="40" height="28" rx="3" fill="none" stroke="#ffffff" stroke-width="2.25"/>
  <!-- envelope V flap -->
  <path d="M12 23 L32 36 L52 23" fill="none" stroke="#ffffff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- PDF page peek (archive) bottom-right -->
  <rect x="38" y="34" width="16" height="20" rx="1.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.75"/>
  <path d="M48 34 L54 34 L54 40 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M48 34 L48 40 L54 40" fill="none" stroke="#2563eb" stroke-width="1"/>
</svg>
